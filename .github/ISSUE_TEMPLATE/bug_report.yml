name: Bug report
description: Report a reproducible problem with the prototype.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the controls used and a minimal example you have permission to share. Do not upload private footage.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and project version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal data and local file paths before sharing.
